<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <link href="style.css" rel="stylesheet">
    <title>問い合わせフォーム</title>
</head>

<body>
    <div>
        <form>
            <dl>

                <dt>お問い合わせの種別</dt>
                <dd>
                    <label><input type="checkbox" name="type" value="">お問い合わせ</label>
                    <label><input type="checkbox" name="type" value="">新規お申し込み</label>
                    <label><input type="checkbox" name="type" value="">資料請求</label>
                </dd>


                <dt><label for="name">お名前<span class="must">※</span></label></dt>
                <dd>
                    <input type="text" id="name" name="name" required placeholder="田中 花子">
                </dd>

                <dt><label for="kana">ふりがな<span class="must">※</span></label></dt>
                <dd>
                    <input type="text" id="kana" name="kana" required placeholder="たなか はなこ">
                </dd>

                <dt><label for="email">メールアドレス<span class="must">※</span></label></dt>
                <dd>
                    <input id="email" type="email" name="email" required placeholder="xxxx@yyyy.com">
                </dd>

                <dt>性別</dt>
                <dd>
                    <label><input type="radio" name="sex" value="man">男性</label>
                    <label><input type="radio" name="sex" value="woman">女性</label>
                </dd>

                <dt><label for="place">どこでお知りになりましたか</label></dt>
                <dd>
                    <select id="place" name="">
                        <option value="brochure/DM">ちらし・DM</option>
                        <option value="refer">知り合いからの紹介</option>
                        <option value="others">その他</option>
                    </select>
                </dd>

                <dt><label for="freetext">お問い合わせ・ご質問内容</label></dt>
                <dd>
                    <textarea id="freetext" name="" placeholder="ご質問内容をご記載ください" maxlength="300" cols="50"
                        rows="3"></textarea>
                </dd>
            </dl>
        </form>
        <p><input type="submit" name="submit" value="送信する"></p>

    </div>
</body>

</html>
